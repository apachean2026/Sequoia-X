name: Sequoia-X 每日选股

on:
  workflow_dispatch:

  schedule:
    # 北京时间周一至周五 18:30
    # GitHub Actions 使用 UTC
    # 北京时间 = UTC + 8
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

jobs:
  run-sequoia:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # ① 下载 Sequoia-X 代码
      # =========================================================
      - name: ① 下载 Sequoia-X 代码
        uses: actions/checkout@v4

      # =========================================================
      # ② 安装 Python
      # =========================================================
      - name: ② 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================================================
      # ③ 安装 uv
      # =========================================================
      - name: ③ 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # =========================================================
      # ④ 安装项目依赖
      # =========================================================
      - name: ④ 安装项目依赖
        run: uv sync

      # =========================================================
      # ⑤ 创建数据目录
      # =========================================================
      - name: ⑤ 创建数据目录
        run: mkdir -p data

      # =========================================================
      # ⑥ 下载历史数据库
      # =========================================================
      - name: ⑥ 下载历史数据库
        run: |
          curl -L --fail \
            -o data/sequoia_v2.db \
            https://github.com/apachean2026/Sequoia-X/releases/download/v1.0.0-data/sequoia_v2.db

      # =========================================================
      # ⑦ 检查数据库
      # =========================================================
      - name: ⑦ 检查数据库
        run: |
          ls -lh data/sequoia_v2.db

      # =========================================================
      # ⑧ 创建 .env 配置文件
      # =========================================================
      - name: ⑧ 创建 .env 配置文件
        run: |
          cat > .env << 'EOF'
          DB_PATH=data/sequoia_v2.db
          START_DATE=2024-01-01
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          EOF

      # =========================================================
      # ⑨ 测试 Alpha158 数据集
      # =========================================================
      - name: ⑨ 测试 Alpha158 数据集
        run: |
          uv run python -m sequoia_x.ml.test_dataset

      # =========================================================
      # ⑩ 训练 Alpha158 + LightGBM
      # =========================================================
      - name: ⑩ 测试 LightGBM 模型训练
        run: |
          uv run python -m sequoia_x.ml.trainer

      # =========================================================
      # ⑪ AI TOP10 预测
      # =========================================================
      - name: ⑪ 测试 AI TOP10 预测
        run: |
          uv run python -m sequoia_x.ml.predict

      # =========================================================
      # ⑫ AI 历史回测
      # =========================================================
      - name: ⑫ AI历史回测
        run: |
          uv run python -m sequoia_x.ml.backtest

      # =========================================================
      # ⑫.1 保存 AI 历史回测结果
      # =========================================================
      - name: ⑫.1 保存AI回测结果
        uses: actions/upload-artifact@v4
        with:
          name: alpha158-lightgbm-backtest
          path: backtest_results.csv
          if-no-files-found: error

      # =========================================================
      # ⑬ 执行原有 Sequoia-X 每日选股
      # =========================================================
      - name: ⑬ 执行每日选股
        run: |
          uv run python main.py
