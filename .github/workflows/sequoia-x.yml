name: Sequoia-X 每日选股

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * 1-5"

permissions:
  contents: read

jobs:
  run-sequoia:
    runs-on: ubuntu-latest

    steps:
      - name: ① 下载 Sequoia-X 代码
        uses: actions/checkout@v4

      - name: ② 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ③ 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: ④ 安装项目依赖
        run: uv sync

      - name: ⑤ 创建数据目录
        run: mkdir -p data

      - name: ⑥ 下载历史数据库
        run: |
          curl -L \
            -o data/sequoia_v2.db \
            https://github.com/apachean2026/Sequoia-X/releases/download/v1.0.0-data/sequoia_v2.db

      - name: ⑦ 检查数据库
        run: |
          ls -lh data/sequoia_v2.db

      - name: ⑧ 创建 .env 配置文件
        run: |
          cat > .env << 'EOF'
          DB_PATH=data/sequoia_v2.db
          START_DATE=2024-01-01
          FEISHU_WEBHOOK_URL=${{ secrets.FEISHU_WEBHOOK_URL }}
          EOF

      - name: ⑨ 执行每日选股
        run: uv run python main.py